<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body{
            background-color: rgb(78, 190, 241);
        }
    </style>
</head>

<body>
    <form>
        <h1>Registration Form</h1>
        <label>FirstName:</label>
        <input type="text" name="firstName" size="15" required>
        <br>
        <label>MiddleName:</label>
        <input type="text" name="middleName" size="15" required>
        <br>
        <label>LastName:</label>
        <input type="text" name="lastName" size="15" required>
        <br><br>
        <label>Course:</label>
        <select>
            <option value="Course">Course</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BBA">BBA</option>
            <option value="MBA">MBA</option>
            <option value="BTECH">BTECH</option>
        </select>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female" required> Female
        <input type="radio" name="gender" value="other" required> Other
        <br><br>
        <label>Phone:</label>
        <input type="text" name="country code" value="+91" size="2" required>
        <input type="text" name="phone" size="10" required><br><br>
        <label>Address:</label>
        <textarea name="address" cols="20" rows="4"></textarea><br><br>
        <label>Password:</label>
        <input type="password" name="pass" id="pass" required><br><br>
        <label>Re-type Password:</label>
        <input type="password" name="repass" id="repass" required><br><br>
        <input type="button" value="submit">


    </form>
</body>
</html>
